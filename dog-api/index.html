<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐕 Dog API Explorer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>🐶 Dog API Explorer</h1>
        <p>Cliente (navegador) ↔ Servidor (dog.ceo)</p>
      </header>

      <main>
        <div class="control-panel">
          <div class="card">
            <h2>🎮 Controles</h2>

            <button id="randomDog" class="btn primary">
              🎲 Perrito Aleatorio
            </button>
            <button id="multipleDogs" class="btn success">🐕 5 Perritos</button>

            <!-- desafio #3: <datalist> -->
            <div class="breed-section">
              <label for="breedInput">🔍 Raza:</label>
              <input
                type="text"
                id="breedInput"
                list="razas"
                placeholder="Cargando razas..."
                disabled
              />
              <datalist id="razas"></datalist>
              <button id="searchBreed" class="btn secondary" disabled>
                Ver raza
              </button>
            </div>

            <div class="debug">
              <h3>📡 Última petición:</h3>
              <pre id="requestUrl" class="code">
GET https://dog.ceo/api/breeds/image/random</pre
              >
              <h3>📦 Última respuesta:</h3>
              <pre id="jsonResponse" class="code">
{
  "message": "Esperando...",
  "status": "success"
}</pre
              >
            </div>
          </div>
        </div>

        <!-- desafio #4: <article> y <section> -->
        <section class="results-panel">
          <h2>🖼️ Resultados</h2>
          <div id="dogContainer" class="dog-grid">
            <div class="placeholder">🐾 Haz clic en un botón</div>
          </div>
        </section>
      </main>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
