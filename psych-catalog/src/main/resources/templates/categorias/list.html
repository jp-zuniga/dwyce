<html
  lang="en"
  xlmns:th="https://www.thymleaf.org"
  xmlns:xlmns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.w3.org/1999/xhtml"
>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listado</title>
</head>
<body>
<main>
  <div class="page-header">
    <h1 th:text="${titulo}">Gestión de Categorías</h1>
  </div>
  <div class="table-container">
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="categoria : ${categorias}">
        <td th:text="${categoria.id}">ID de Categoría</td>
        <td th:text="${categoria.nombre}">Nombre de Categoría</td>
        <td th:text="${categoria.descripcion}">
          Descripción de Categoría
        </td>
        <td th:text="${categoria.acciones}">Acciones de Categoría</td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
